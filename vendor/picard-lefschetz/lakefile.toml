name = "picard-lefschetz"
version = "0.1.0"
keywords = ["math", "complex-analysis", "stokes", "thimble"]
defaultTargets = ["PicardLefschetz"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

# Pure Lean infrastructure: depends only on Mathlib. No physics or
# QFT-specific dependencies — this library is intended to be reused
# from pphi2N (v3 QHJ thimble axiom), grossneveu (σ-correlator
# bound), and downstream wesszumino / glsm-witten work, so it must
# stay model-agnostic.
[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "PicardLefschetz"
